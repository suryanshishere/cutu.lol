  <body>
    <main class="app-shell">
      <header class="masthead" aria-label="Visitor Counts">
        <span class="brand-name">cutu</span>
        <div class="site-stats" aria-label="Site Visitors">
          <span class="visitor-stat" title="Unique Browsers Today">
            <span class="today-dot" aria-hidden="true"></span>
            <strong id="today-viewers">0</strong>
            <span>Visitors Today</span>
          </span>
          <span class="stat-divider" aria-hidden="true"></span>
          <span class="visitor-stat" title="Total Visitors">
            <span class="eye-icon" aria-hidden="true"></span>
            <strong id="total-visits">0</strong>
            <span>Total Visitors</span>
          </span>
        </div>
      </header>

      <section class="workspace" aria-label="Meme editor">
        <div class="composer">
          <form id="text-form" class="text-form">
            <label for="message">Type Your Text</label>
            <div class="sketch-field">
              <textarea
                id="message"
                name="message"
                maxlength="120"
                rows="4"
                spellcheck="true"
                aria-label="Video Text"
                placeholder="Type Something..."
              >Small steps. Big wheel energy.</textarea>
              <fieldset id="text-appearance" class="text-appearance">
                <legend class="visually-hidden">Text appearance</legend>
                <div class="text-format-row">
                  <label class="visually-hidden" for="text-font">Text font</label>
                  <select id="text-font" aria-label="Text font">
                    <option value="classic">Classic</option>
                    <option value="bold">Bold sans</option>
                    <option value="handwritten">Handwritten</option>
                    <option value="typewriter">Typewriter</option>
                  </select>
                  <div class="text-alignment" role="group" aria-label="Text alignment">
                    <button type="button" data-align="left" aria-label="Align left" title="Align left" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4h14M3 8h9M3 12h14M3 16h9" /></svg></button>
                    <button type="button" data-align="center" aria-label="Align center" title="Align center" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4h14M6 8h8M3 12h14M6 16h8" /></svg></button>
                    <button type="button" data-align="right" aria-label="Align right" title="Align right" aria-pressed="true"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4h14M8 8h9M3 12h14M8 16h9" /></svg></button>
                    <button type="button" data-align="justify" aria-label="Justify text" title="Justify text" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4h14M3 8h14M3 12h14M3 16h14" /></svg></button>
                  </div>
                </div>
                <div class="text-size-row">
                  <label for="text-size">Size</label>
                  <input id="text-size" type="range" min="50" max="200" step="1" value="90" />
                  <output id="text-size-value" for="text-size">90%</output>
                  <button id="text-reset" class="text-reset" type="button">Reset</button>
                </div>
                <div class="text-appearance-footer">
                  <p id="text-help" class="text-help">Drag the text in the preview to place it.</p>
                  <label id="text-motion-option" class="text-motion" for="text-motion"><input id="text-motion" type="checkbox" checked />Text motion</label>
                </div>
                <p id="appearance-status" class="visually-hidden" role="status" aria-live="polite"></p>
              </fieldset>
            </div>
            <p id="status" class="visually-hidden" role="status" aria-live="polite">Ready</p>
          </form>
        </div>

        <div class="preview-column">
          <div id="stage" class="stage" data-stamp="baby-boo" aria-label="Baby Boo Video Preview">
            <div id="preview-text" class="preview-text is-right" aria-hidden="true"></div>
            <div id="text-overlay" class="text-overlay" role="group" tabindex="0" aria-label="Move video text with arrow keys" aria-describedby="text-help" aria-disabled="false"></div>
            <div class="text-guide text-guide-x" aria-hidden="true"></div>
            <div class="text-guide text-guide-y" aria-hidden="true"></div>
            <video
              id="meme-video"
              class="meme-video"
              loop
              muted
              playsinline
              preload="auto"
            ><source src="/hamster-preview.webm" type="video/webm; codecs=&quot;vp9, opus&quot;" /><source src="/hamster-fallback.mp4" type="video/mp4" /></video>
          </div>

          <div class="preview-tools">
            <div class="stamp-picker" role="group" aria-label="Choose a stamp">
              <button id="character-stamp" class="character-stamp is-selected" data-stamp="baby-boo" type="button" aria-label="Baby Boo" title="Baby Boo" aria-pressed="true">
                <img src="baby-boo-stamp.png" alt="" />
              </button>
              <button id="speed-stamp" class="character-stamp" data-stamp="speed" type="button" aria-label="Speed" title="Speed" aria-pressed="false">
                <img src="/speed-stamp.png?v=2" alt="" />
              </button>
            </div>
            <div class="output-actions">
              <div class="stage-controls" aria-label="Preview Controls">
                <button id="sound-button" class="stage-control" type="button" aria-pressed="false" aria-label="Turn Sound On" title="Turn Sound On">
                  <svg id="sound-icon" class="button-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8h3l4-3v10l-4-3H3zM14 7l3 3m0 0-3 3" /></svg>
                  <span id="sound-label" class="visually-hidden">Sound Off</span>
                </button>
                <button id="play-button" class="stage-control" type="button" aria-label="Pause Video" title="Pause Video">
                  <svg id="play-icon" class="button-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M6.5 4.5v11m7-11v11" /></svg>
                </button>
              </div>
              <button id="share-button" class="share-button icon-button" type="button" aria-label="Copy Share Link" title="Copy Share Link">
                <svg id="share-icon" class="button-icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="7" y="6" width="10" height="11" rx="1.5" /><path d="M13 6V4.5A1.5 1.5 0 0 0 11.5 3h-7A1.5 1.5 0 0 0 3 4.5v8A1.5 1.5 0 0 0 4.5 14H7" /></svg>
                <span id="share-label">Copy Link</span>
              </button>
              <button id="download-toggle" class="download-button" type="button" aria-haspopup="dialog" aria-controls="download-dialog">
                <svg class="button-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9m-3-3 3 3 3-3M4 13v3h12v-3" /></svg>
                <span>Download</span>
              </button>
            </div>
          </div>
        </div>
      </section>

        </nav>

    <dialog id="download-dialog" class="download-dialog" aria-label="Download Baby Boo" tabindex="-1">
      <div class="download-dialog-content">
        <button id="download-close" class="download-close" type="button" aria-label="Close download dialog">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15" /></svg>
        </button>
        <img class="download-stamp" src="/baby-boo-stamp.png" alt="Baby Boo" />
        <form id="download-email-form" class="download-email-form" data-clarity-mask="true" novalidate>
          <fieldset id="download-formats" class="download-formats">
            <legend class="visually-hidden">Download format</legend>
            <label class="download-format"><input type="radio" name="format" value="video" checked /><span>Video</span></label>
            <label class="download-format"><input type="radio" name="format" value="gif" /><span>GIF</span></label>
          </fieldset>
          <div id="download-email-field" class="download-email-field">
            <label for="download-email" class="visually-hidden">Email address</label>
            <input id="download-email" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" maxlength="254" placeholder="Your email" required aria-describedby="download-email-error" />
          </div>
          <p id="download-email-error" class="download-error" role="alert" hidden></p>
          <button id="download-continue" class="modal-primary" type="submit">Continue to download</button>
        </form>
        <div id="download-result" class="download-result" hidden>
          <p id="download-result-message" role="status" aria-live="polite" aria-atomic="true"></p>
          <progress id="download-progress" max="100" aria-label="Export progress" hidden></progress>
          <a id="download-save" class="modal-primary" href="#" hidden>Save file</a>
          <button id="download-another" class="modal-secondary" type="button" hidden>Back</button>
        </div>
        <a id="download-button" href="#" download="hamster-type.mp4" hidden><span id="download-label">Video</span></a>
        <a id="gif-download-button" href="#" download="hamster-type.gif" hidden><span id="gif-download-label">GIF</span></a>
      </div>
    </dialog>
    <p id="action-message" class="action-message" role="status" aria-live="polite"></p>
    <canvas id="export-canvas" hidden></canvas>
    <video id="export-video" muted playsinline preload="none" hidden><source src="/hamster-export.webm" type="video/webm; codecs=&quot;vp9, opus&quot;" /><source src="/hamster-fallback.mp4" type="video/mp4" /></video>
